name: Automated API Observability Engine

on:
  schedule:
    # Runs automatically every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Benchmark Suite
        run: python benchmark.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md history.csv latency_trend.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: API performance benchmarks & SLA metrics" && git push)
